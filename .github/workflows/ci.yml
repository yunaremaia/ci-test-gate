name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Installs the same pinned-major ruff as a local `.[dev]` install, so the
      # gate cannot pass locally and fail here on a version difference.
      - run: pip install -e '.[dev]'
      # Rule selection lives in ruff.toml, not in this command: `ruff check`
      # reads the config, so there is no second place to keep in sync.
      # No path argument, so the gate covers src/ and tests/ alike. Narrowing
      # it to src/ is what would have missed the shadowed test in
      # tests/test_cli.py that this gate was added for.
      - name: Lint (pyflakes)
        run: ruff check .
      - name: Lint statistics
        if: always()
        run: ruff check . --select=F --statistics

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: pytest tests/ -v --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: pytest tests/ --cov --cov-report=xml
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install mkdocs mkdocs-material
      - run: mkdocs build
      # A green build proves nothing about the sitemap: without site_url mkdocs
      # still succeeds and still writes sitemap.xml, as a valid but EMPTY
      # urlset. The sibling repo driftcheck shipped exactly that for months.
      # This is the only job where mkdocs is installed, so it is the only place
      # the real artifact can be checked.
      - run: python scripts/check_docs_sitemap.py --site-dir site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, docs]
    runs-on: ubuntu-latest
    # GitHub allows a single in-flight Pages deployment per repository, and
    # actions/deploy-pages does not queue: a second concurrent create fails with
    # "due to in progress deployment ... or wait for it to complete". Merging a
    # batch of PRs lands several pushes on main within a minute, so without this
    # group whichever deployment arrives second fails even though its build and
    # tests are green. The group serializes them and cancel-in-progress drops the
    # superseded one instead of publishing a stale build.
    #
    # This belongs on the job, not the workflow: a workflow-level group would
    # also cancel the test matrix of a newer commit whenever an older commit
    # reaches this step.
    concurrency:
      group: pages-deploy-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

