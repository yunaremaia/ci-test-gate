name: CI Test Gate

on:
  pull_request:
    branches: [main, master]

jobs:
  ci-test-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch base ref from upstream
        # The runner substitutes a ${{ }} expression before bash ever parses the
        # line, so quoting it in the script would protect nothing: a ref name
        # containing shell metacharacters lands in the command line verbatim.
        # Routing both values through the step environment hands them to bash as
        # variables, which keeps the command line fixed no matter what they hold.
        env:
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch "https://github.com/$BASE_REPO" "$BASE_REF" --depth=1

      - name: Install ci-test-gate
        run: pip install -e '.[dev]'

      - name: Analyze PR
        run: |
          git diff FETCH_HEAD...HEAD | ci-test-gate suggest --diff - --output markdown > /tmp/gate_output.md
          test -s /tmp/gate_output.md

      - name: Publish recommendation
        uses: actions/github-script@v8
        env:
          GATE_REPORT: /tmp/gate_output.md
        with:
          script: |
            // The report is read from disk instead of being interpolated into this
            // script: its content is derived from the PR diff, which for fork PRs is
            // untrusted. Interpolating it through a GitHub expression would let a
            // backtick in the diff break out of the template literal and run
            // arbitrary JavaScript in the runner.
            const fs = require('fs');
            const report = fs.readFileSync(process.env.GATE_REPORT, 'utf8');

            // Always surface the recommendation in the run summary, so the result is
            // visible even when commenting is not permitted.
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report + '\n');

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report,
              });
            } catch (error) {
              // Pull requests from forks receive a read-only GITHUB_TOKEN, so
              // commenting is impossible by design. That must not fail the check; any
              // other error is a genuine problem and still propagated.
              if (error.status === 403) {
                core.info('Token is read-only (fork PR): recommendation published to the job summary only.');
                return;
              }
              throw error;
            }