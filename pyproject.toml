[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-test-gate"
version = "0.1.1"
description = "LLM-powered test selection for CI — run only the tests that matter"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Yunare Maia", email = "yunare@gmail.com" },
]
# Deliberately no "coverage" keyword: the tool selects tests, it does not
# measure coverage, and the README says so. Claiming it would be a bad first
# impression for anyone who installs it expecting a coverage tool.
keywords = [
    "ci",
    "testing",
    "test-selection",
    "test-impact-analysis",
    "llm",
    "github-actions",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = ["pyyaml>=6.0", "httpx>=0.27", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "openai>=1.0", "ruff>=0.6"]

[project.scripts]
ci-test-gate = "ci_test_gate.cli:main"

[project.urls]
# `Documentation` points at the GitHub Pages site built from docs/ by the
# `docs`/`deploy-docs` jobs in .github/workflows/ci.yml, not at the docs/
# directory in this repository — the directory is a source tree, not a site.
# `Source` replaces `Repository` rather than joining it, so the same URL is not
# advertised twice.
Homepage = "https://github.com/yunaremaia/ci-test-gate"
Documentation = "https://yunaremaia.github.io/ci-test-gate/"
Source = "https://github.com/yunaremaia/ci-test-gate"
Issues = "https://github.com/yunaremaia/ci-test-gate/issues"
Funding = "https://github.com/sponsors/yunaremaia"
Changelog = "https://github.com/yunaremaia/ci-test-gate/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ci_test_gate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=ci_test_gate --cov-report=term-missing"

[tool.coverage.run]
source = ["ci_test_gate"]
# Statement coverage only. Enabling `branch` would silently change what the
# floor below means, so it is pinned explicitly rather than left to default.
branch = false

[tool.coverage.report]
# The gate lives here, not as `--cov-fail-under` in the workflow, so a local
# run and CI enforce the exact same number. Do not move it to a CLI flag.
#
# 99% is the honest ceiling, not a round number chosen to look good. Three
# statements are unreachable dead code:
#   - cli.py:131         `return 0` after both subcommands; `add_subparsers`
#                        is `required=True`, so `args.command` is always one
#                        of the two values handled above it.
#   - diff_parser.py:103 `elif line.startswith(" ")`; `line` is assigned from
#                        `raw_line.strip()` two statements earlier, so it can
#                        never begin with a space.
#   - parser.py:29       `if i + 2 > len(parts): break`; the header regex has
#                        two capture groups, so `re.split` always yields 3n+1
#                        elements and the loop never overruns.
# They are left uncovered rather than hidden with `# pragma: no cover`.
fail_under = 99
# `should_fail_under` compares the total *rounded to this precision*. The
# default of 0 would let a real 98.5% satisfy a floor of 99; two decimals makes
# the gate mean what it says.
precision = 2
