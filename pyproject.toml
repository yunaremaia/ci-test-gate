[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-test-gate"
version = "0.1.0"
description = "LLM-powered test selection for CI — run only the tests that matter"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Yunare Maia", email = "yunare@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pyyaml>=6.0", "httpx>=0.27", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "openai>=1.0"]

[project.scripts]
ci-test-gate = "ci_test_gate.cli:main"

[project.urls]
Homepage = "https://github.com/yunaremaia/ci-test-gate"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ci_test_gate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=ci_test_gate --cov-report=term-missing"

[tool.coverage.run]
source = ["ci_test_gate"]
